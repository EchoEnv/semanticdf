# Trino server config — single-node test cluster.
#
# Per the user's hard requirement: "monitor memory, disk while
# running, to not explode server." Memory caps live at THREE levels:
#
#   1. Docker (docker-compose.yml: memory: 1536M) — kernel OOM-kill
#      boundary, prevents host starvation.
#   2. JVM heap (jvm.config: -Xmx768m) — what the JVM may ask for.
#   3. Trino query pools (this file) — what queries may consume.
#
# We use ONLY Trino 435's stable, minimal config keys. Anything
# not in this file gets Trino's safe default (which is conservative
# for the small-memory envelope). Removed keys from prior versions:
#   - 'query.max-total-memory-per-node' (deprecated/renamed)
#   - 'exchange.drop-table-drops-true-on-commit' (renamed)
#   - 'http-server.http-port' (renamed to 'http-server.port')

coordinator=true
node-scheduler.include-coordinator=true

# Single-node: no extra discovery needed.
discovery-server.enabled=true
discovery.uri=http://localhost:8080

# Memory caps that fit inside the JVM heap (768MB).
# Trino enforces the relationship at startup; misconfigured
# heaps fail-fast with a clear error.
query.max-memory-per-node=256MB
query.max-memory=512MB

# Concurrency caps — small for a test cluster.
task.concurrency=2
task.max-worker-threads=4
