# The 'tpch' catalog — Trino's built-in TPC-H connector.
#
# Why tpch (not memory):
#   - Ships with Trino 435; no separate config needed
#   - tiny schema has ~25 rows in 'nation' (the smallest table)
#   - Read-only — predictable, no bootstrap needed, no write races
#
# Per user constraint: 'monitor memory, disk while running, to
# not explode server.' tiny (~sf 0.01) fits inside the 768M JVM
# heap with substantial headroom. The 256MB per-query cap
# stays well below.

connector.name=tpch

# Per the test assertion we use one of the TPC-H tables in this
# catalog. See TrinoIntegrationSpec.scala:
#   source = tpch.tiny.nation
