# Unity Catalog OSS server config — override of the bundled defaults.
#
# The bundled `/home/unitycatalog/etc/conf/server.properties` has
# everything needed for production. For the integration test we
# only need to override the surface that touches disk / auth:
#   - storage paths (pointed at bind-mounted volumes)
#   - auth disabled (so tests don't need tokens)
#
# Anything else falls through to the bundled defaults via the
# image's `start-uc-server` script.

server.env=dev

# Disable authorization for the integration test (no token needed).
# Production users flip this to enable with their IdP config.
server.authorization=disable