name: CI

# Run on every push to main and on all pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Spark ${{ matrix.spark }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "3.5.8"
            profile: ""
          - spark: "4.1.1"
            profile: "-Pspark4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Show JDK version
        run: java -version

      - name: Run tests
        run: >-
          mvn test ${{ matrix.profile }}
          -Dmaven.test.failure.ignore=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-spark-${{ matrix.spark }}
          path: target/surefire-reports/
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-spark-${{ matrix.spark }}
          path: target/surefire-reports/TEST-*.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # OKF drift check — see Makefile and docs/agents/maintenance.md.
  # Fails the PR if docs/agents/reference/ is stale relative to examples/*/models.
  # ---------------------------------------------------------------------------
  okfgen-drift-check:
    name: OKF drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # OkfGen's gitTimestamp runs `git log -1 --format=%ct -- <file>` against
          # each YAML. Default `fetch-depth: 1` is a shallow clone that only
          # contains the HEAD commit, so git returns HEAD's commit time for every
          # file rather than that file's actual last-touching ancestor — producing
          # a timestamp that drifts from what `make okfgen` produces locally
          # against full history. `fetch-depth: 0` fetches all branches/tags
          # so the same commit-history traversal runs in CI as locally.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
      - name: Verify OKF bundle is in sync with YAMLs
        run: make okfgen-check

  # ---------------------------------------------------------------------------
  # Consumer POM build — verifies the 19 sibling Maven projects
  # (semanticdf-mcp, semanticdf-platform, 17 examples) still compile after
  # a library change. Without this, a regression in the library's public
  # surface (or in any consumer POM) wouldn't be caught by the library
  # tests alone — consumers are independent Maven projects, not modules of
  # the reactor.
  #
  # Phase 1 follow-up: added after PR #346 (consumer POM artifact rename)
  # because the rename \`semanticdf_2.13\` → \`semanticdf-spark_2.13\` only
  # surfaced a build failure locally; CI had no way to catch it.
  # ---------------------------------------------------------------------------
  consumer-build:
    name: Consumer POMs compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
      - name: Install library into local m2 (so consumers can resolve it)
        run: mvn install -DskipTests
      - name: Verify every consumer POM compiles (main + test)
        # Uses `mvn test-compile` (main + test) — any test-source compile
        # error in a consumer that consumes the library would be caught
        # here. Pre-fix (PR #347), this step used `mvn compile` only,
        # because some consumer test files had pre-existing errors
        # (the `AuditLogSpec` issue fixed in the same PR series as this
        # step). Now that the AuditLogSpec is fixed, test-compile is
        # safe to enable.
        run: |
          set -e
          CONSUMERS="semanticdf-mcp semanticdf-platform"
          for d in examples/*/; do
            # Skip cli-consumer: it's a pure HTTP client with no semanticdf dep
            # (per its README), so it doesn't need to compile against the library.
            if [ "$d" = "examples/cli-consumer/" ]; then continue; fi
            CONSUMERS="$CONSUMERS $d"
          done
          for d in $CONSUMERS; do
            echo "=== Compiling $d ==="
            ( cd "$d" && mvn test-compile -q )
          done
          echo "All consumer POMs compile cleanly (main + test)."
